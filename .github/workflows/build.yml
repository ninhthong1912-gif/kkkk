
name: Build VoiceStudio Portable EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'VoiceStudio_Portable_Project/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish EXE
        run: dotnet publish VoiceStudio_Portable_Project/VoiceStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-Portable-Windows-x64
          path: publish/
